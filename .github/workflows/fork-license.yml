# Fork license obligations and feature registry (FORK.md "License obligations",
# "Fork feature registry"). Not part of upstream. This fork does not use GitHub
# Actions; scripts/hoon/fork-pr-check.sh runs the same checks locally (FORK.md
# "Verification"). The file stays as the description of the checks.
name: Fork license check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  license:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch upstream release tags
        run: git fetch --no-tags https://github.com/multica-ai/multica.git '+refs/tags/v*:refs/upstream-tags/v*'

      - name: Self-test
        run: bash scripts/hoon/license-check.test.sh

      - name: Check license obligations
        run: bash scripts/hoon/license-check.sh

      - name: Install PyYAML for the feature registry check
        run: python3 -m pip install --user --quiet --break-system-packages pyyaml

      - name: Feature registry self-test
        run: bash scripts/hoon/features-check.test.sh

      - name: Check feature registry
        run: bash scripts/hoon/features-check.sh

      - name: Upstream triage self-test
        run: bash scripts/hoon/upstream-triage.test.sh

      - name: Local PR check self-test
        run: bash scripts/hoon/fork-pr-check.test.sh

      - name: Absorb gate self-test
        run: bash scripts/hoon/absorb-gate.test.sh
