  - id: chat-bar-all-chips
    summary: The bottom chat bar shows every chat chip in a sideways-scrolling strip instead of folding extras into a +N menu.
    status: active
    kind: web-ui
    cards: [CALA-72]
    origin:
      type: ours
      commits: ["6565efb51"]
    files:
      - packages/views/chat/components/chat-bar.tsx
      - packages/views/chat/components/chat-bar.test.tsx
      - packages/views/chat/components/chat-bar-sessions.ts
      - packages/views/chat/components/chat-bar-sessions.test.ts
      - packages/views/chat/components/use-chat-window-anchor.ts
      - packages/views/layout/bottom-bar.tsx
    watch:
      - path: packages/views/chat/components/**
        why: chat-bar-history.tsx renders in the bar; chat-window.tsx anchors on [data-slot="chat-bar"] via use-chat-window-anchor
      - path: packages/views/chat/floating-chat-visibility.ts
        why: decides when bottom-bar.tsx renders the chat bar
      - path: packages/views/layout/bottom-bar-styles.ts
        why: BOTTOM_BAR_ITEM_CLASS used by every chip
      - path: packages/views/layout/dashboard-layout.tsx
        why: mounts AppBottomBar on web
      - path: packages/views/layout/app-shell-context.tsx
        why: useAppShell in bottom-bar.tsx
      - path: packages/views/layout/panels/team-status.ts
        why: team status sits beside the chips (shrink-0)
      - path: apps/desktop/src/renderer/src/components/desktop-layout.tsx
        why: mounts AppBottomBar on desktop
      - path: packages/core/chat/**
        why: useChatStore, chatSessionsOptions, pendingChatTasksOptions feed the chips
      - path: packages/ui/hooks/use-mobile.ts
        why: the bar is hidden below 768px
      - path: packages/ui/components/common/tooltip-hint.tsx
        why: chip tooltips
      - path: packages/ui/styles/**
        why: tokens and utilities the strip's layout uses
      - path: packages/views/locales/*/chat.json
        why: bar.close_chip and the now-unused bar.more_* strings
    upstream_equivalent:
      symbols: [maxChipsForWidth, useMaxChips, chat-bar-chips]
      keywords: [chat bar overflow, chat chips, bottom bar chips]
    tests:
      - vitest: packages/views/chat/components/chat-bar.test.tsx
        name: shows a chip for every chat instead of folding the rest into a +N menu
      - vitest: packages/views/chat/components/chat-bar.test.tsx
        name: scrolls the open chat's chip into view, so the window opens above it
      - vitest: packages/views/chat/components/chat-bar-sessions.test.ts
        name: shows every chip with no overflow when there is no limit
      - vitest: packages/views/layout/bottom-bar.test.tsx
    scenarios:
      - name: every chip visible, strip scrolls
        path: /<workspace-slug>/issues
        widths: [1440, 900]
        setup: at least 8 chats that are running, unread or opened in quick chat
        steps:
          - Open the page and wait for the bottom bar.
          - Count chips inside [data-slot="chat-bar-chips"].
          - Scroll the mouse wheel over the strip.
          - Click the right-most chip.
        selectors:
          - '[data-slot="chat-bar"]'
          - '[data-slot="chat-bar-chips"] [data-chat-anchor]'
        expect:
          - One chip per qualifying chat; no "+N" button (aria-label "N more chats") anywhere in the bar.
          - The wheel scrolls the strip sideways; team status and the Ask Multica button keep their width.
          - The clicked chip scrolls fully into view and the chat window opens above it.
      - name: bar hidden on a narrow window
        path: /<workspace-slug>/issues
        widths: [700]
        steps:
          - Open the page.
        selectors: []
        expect:
          - No [data-slot="chat-bar"] (upstream behaviour below 768px, unchanged).
    drop_when: upstream shows every chip without a +N overflow menu.

  # Split from chat-bar-all-chips: upstream can ship either one without the
  # other, so each is dropped on its own condition.
  - id: chat-bar-chip-reorder
    summary: Bottom-bar chat chips can be dragged (or moved with Space and the arrow keys) into any order, which is remembered per workspace; new chips come in on the left.
    status: active
    kind: web-ui
    cards: [CALA-300]
    origin:
      type: ours
      commits: ["165e7ed1b"]
    files:
      - packages/core/chat/store.ts
      - packages/core/chat/store.test.ts
      - packages/views/chat/components/chat-bar.tsx
      - packages/views/chat/components/chat-bar.test.tsx
      - packages/views/chat/components/chat-bar-sessions.ts
      - packages/views/chat/components/chat-bar-sessions.test.ts
      - packages/views/chat/components/use-chat-window-anchor.ts
      - packages/views/chat/components/use-chat-window-anchor.test.tsx
    watch:
      - path: packages/views/layout/use-drag-click-guard.ts
        why: cancels the click that ends a drag, so a dropped chip does not open its chat
      - path: packages/views/layout/bottom-bar-styles.ts
        why: BOTTOM_BAR_ITEM_CLASS on the dragged chip button
      - path: packages/views/chat/components/chat-window.tsx
        why: uses useChatWindowAnchor, which follows a chip moved by a drag
      - path: pnpm-workspace.yaml
        why: "@dnd-kit/* catalog versions (sensors, keyboard codes, modifiers)"
      - path: packages/ui/components/common/tooltip-hint.tsx
        why: the chip button is the tooltip trigger and also carries dnd-kit's listeners
    upstream_equivalent:
      symbols: [chatBarOrder, setChatBarOrder]
      keywords: [reorder chat chips, drag chat chip, chat bar order]
    tests:
      - vitest: packages/views/chat/components/chat-bar-sessions.test.ts
        name: follows the order the chips were dragged into
      - vitest: packages/views/chat/components/chat-bar-sessions.test.ts
        name: puts a chip that is not in the dragged order first, newest first
      - vitest: packages/core/chat/store.test.ts
        name: remembers the order the chips were dragged into, across a reload
      - vitest: packages/core/chat/store.test.ts
        name: forgets a closed chip's place, so it comes back first
      - vitest: packages/views/chat/components/chat-bar.test.tsx
        name: does not open the chat when its chip is dragged, and saves the new order
      - vitest: packages/views/chat/components/chat-bar.test.tsx
        name: treats a press that barely moves as a click
      - vitest: packages/views/chat/components/chat-bar.test.tsx
        name: does not start a drag from a chip's close button
      - vitest: packages/views/chat/components/chat-bar.test.tsx
        name: moves a chip with Space and the arrow keys, and still opens a chat with Enter
      - vitest: packages/views/chat/components/use-chat-window-anchor.test.tsx
        name: follows its chip when the chips are dragged into another order
      - vitest: packages/views/chat/components/use-chat-window-anchor.test.tsx
        name: stays put when a chip is only hovered or its chat starts running
      - vitest: packages/views/chat/components/chat-bar.test.tsx
        name: opens a chat on a click right after a keyboard drag is cancelled with Escape
    scenarios:
      - name: drag a chip into another place
        path: /<workspace-slug>/issues
        widths: [1440, 900]
        setup: at least 8 chats that are running, unread or opened in quick chat, more than the strip shows at once
        steps:
          - Drag the left-most chip to the right by more than 5px and drop it two chips over.
          - Drag a chip to the strip's right edge and hold it there.
          - Click a chip without moving the pointer.
          - Reload the page.
        selectors:
          - '[data-slot="chat-bar-chips"] [data-chat-chip]'
        expect:
          - The other chips slide aside while dragging; the chip lands where it was dropped and the chat does not open.
          - Holding a chip at the edge scrolls the strip.
          - A plain click opens or closes the chat window as before.
          - The order survives the reload; localStorage multica:chat:bar has an order list.
      - name: keyboard reorder
        path: /<workspace-slug>/issues
        widths: [1440]
        setup: at least 3 chips
        steps:
          - Tab to a chip, press Space, press ArrowRight, press Space.
          - Press Enter on a chip.
        selectors:
          - '[data-slot="chat-bar-chips"] [data-chat-anchor]'
        expect:
          - The chip moves one place to the right; the chat does not open.
          - Enter opens the chat window above the chip.
    drop_when: upstream lets bottom-bar chat chips be reordered and remembers the order.

