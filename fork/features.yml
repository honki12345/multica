        name: steps between sent chat messages with Mod+Alt+[ and ] everywhere, composer included
    scenarios:
      - name: step through sent messages
        path: /<workspace-slug>/chat
        widths: [1440]
        setup: a chat with at least five messages you sent and long replies between them, and no wakeup turns, opened from the chat list
        steps:
          - Click into the composer; the list sits at the latest reply.
          - Press Cmd+Option+[ three times.
          - Press Cmd+Option+] twice.
          - Press Cmd+Option+] until the list stops moving.
          - Press Cmd+Option+[ five times quickly, then hold Cmd+Option+] for half a second.
        selectors:
          - '[data-chat-prompt-nav]'
          - '[data-mc="chat-message"][data-role="user"]'
        expect:
          - Each press puts one of your messages at the top of the list, never a reply; the caret stays in the composer.
          - The two forward presses land on the two sent messages after the third one back.
          - After your last message the list goes to the latest reply, and further presses do nothing.
          - The quick presses move exactly five sent messages back and the list stops on a sent message, not a reply; the held key moves one sent message per repeat.
      - name: floating window takes the keys while focused
        path: /<workspace-slug>/issues
        widths: [1440]
        setup: the floating chat window open on a long conversation
        steps:
          - Click into the floating window's composer and press Cmd+Option+[.
        selectors:
          - '[data-mc="chat-window"] [data-chat-prompt-nav]'
        expect:
          - The floating window scrolls to your previous message.
      - name: stop at wakeup dividers
        path: /<workspace-slug>/chat
        widths: [1440]
        setup: a chat where an agent came back through a wakeup at least twice, with your messages and replies around the dividers
        steps:
          - Click into the composer; the list sits at the latest reply.
          - Press Cmd+Option+[ until the list stops moving, then Cmd+Option+] until it reaches the latest reply.
        selectors:
          - '[data-slot="chat-wakeup-divider"]'
          - '[data-mc="chat-message"][data-role="user"]'
        expect:
          - Each press puts either one of your messages or a wakeup divider at the top of the list, never a reply, in conversation order both ways.
      - name: listed in Settings
        path: /<workspace-slug>/settings
        widths: [1440]
        steps:
          - Open Settings, then Shortcuts.
        selectors: []
        expect:
          - General lists "Previous sent message or wakeup" (⌥⌘[) and "Next sent message or wakeup" (⌥⌘]), recordable and resettable like the others.
    drop_when: upstream ships keys that step a chat between the reader's own messages and wakeup turns.

