    scenarios:
      - name: repo checkout from a resident tool shell
        setup: resident daemon as in resident-hermes-gateway
        steps:
          - From a resident task's workdir run `multica repo checkout https://github.com/honki12345/multica`.
          - Run `multica environment list`.
        expect:
