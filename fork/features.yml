        why: readDaemonPortRecord, the fallback for old context files
      - path: server/internal/daemon/health.go
        why: /repo/checkout and /environments/* endpoints these commands call
      - path: server/cmd/multica/cmd_agent.go
        why: MULTICA_DAEMON_PORT task-context rules
    upstream_equivalent:
      symbols: [applyResidentDaemonEnv, daemon_port]
      keywords: [resident repo checkout, MULTICA_DAEMON_PORT not set]
    tests:
      - go: server/cmd/multica
