      - path: packages/views/issues/surface/activity.ts
        why: isQueuedTaskStatus, the running-or-queued rule behind --agent
      - path: packages/core/types/inbox.ts
        why: InboxItemType; a new type must get its group in inboxTypeGroups
      - path: server/internal/handler/inbox.go
        why: InboxItemResponse fields the filters read (issue_label_ids presence marks a server that sends them)
      - path: server/cmd/multica/cmd_id_resolver.go
        why: resolveProjectID / fetchLabelCandidates used by --project and --label
      - path: server/cmd/multica/cmd_issue_batch.go
        why: resolveIssueBatchLabels used by --label
      - path: server/cmd/multica/cmd_issue.go
        why: resolveAssignee / validateIssueStatus / validIssuePriorities used by --assignee, --actor, --status, --priority
    upstream_equivalent:
      prs: [10726, 10861]
      symbols: [filterInboxRows, inboxUnsupportedFlag, archivedInboxListQuery]
      keywords: [inbox list filter, inbox filter flags, inbox list --unread]
    tests:
      - go: server/cmd/multica
        name: TestInboxFilterParityWithWeb
      - go: server/cmd/multica
        name: TestInboxFilterCLIOnlyForms
      - go: server/cmd/multica
        name: TestInboxListResolvesNamesAndAgentState
      - go: server/cmd/multica
        name: TestInboxListRejectsBadValuesBeforeAnyRequest
      - go: server/cmd/multica
        name: TestInboxListRefusesIssueFlagsAnOlderServerCannotAnswer
      - go: server/cmd/multica
        name: TestInboxListKeepsEachRowsOwnCommentAndCurrentServerShape
      - go: server/cmd/multica
        name: TestInboxListUnreadGroupedAndUngrouped
      - go: server/cmd/multica
        name: TestInboxListArchivedSendsWebFilters
      - go: server/cmd/multica
        name: TestInboxListRefusesFilterCombinationsBeforeAnyRequest
      - go: server/cmd/multica
        name: TestInboxListArchivedRechecksNotificationFiltersLocally
      - vitest: packages/core/inbox/filter-parity.test.ts
    scenarios:
      - name: CLI list matches the filtered web Inbox
        setup: a member with notifications on several issues, some unread, logged in to the CLI
        steps:
          - Run `multica inbox list --unread --output json` and note the count.
          - Run `multica inbox list --unread --type mention --output json`.
          - Run `multica inbox list --project <id-prefix> --status todo,in_progress --not status --output json`.
          - In the web Inbox set the same filters (Unread, Type is Mention) and compare the rows.
          - Run `multica inbox list --unread --output json` again.
        expect:
          - Each command exits 0 and prints at most one row per issue.
          - The CLI rows for a filter are the rows the web Inbox lists for the same filter.
          - The --unread count is the same before and after (nothing marked read).
          - '`multica inbox list --type mentions` fails with the list of valid groups.'
    drop_when: upstream `inbox list` gains the same filters and grouping (follow-up to multica-ai/multica#10714).

