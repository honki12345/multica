  - id: chat-pinned-reorder
    summary: Pinned chats in the chat list can be dragged (or moved with Space and the arrow keys) into any order, which is saved on the server by restamping pinned_at, so it is the same on web, desktop and other devices.
    status: active
    kind: web-ui
    cards: [CALA-316]
    origin:
      type: ours
      commits: ["5e100bd8f"]
    files:
