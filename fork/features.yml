      - apps/docs/content/docs/inbox.mdx
      - apps/docs/content/docs/inbox.ko.mdx
      - apps/docs/content/docs/inbox.ja.mdx
      - apps/docs/content/docs/inbox.fr.mdx
      - apps/docs/content/docs/inbox.zh.mdx
      - apps/docs/content/docs/inbox.zh-Hant.mdx
    watch:
      - path: server/pkg/db/queries/inbox_archive.sql
        why: ListArchivedInboxPage filter parameters archivedInboxListQuery sends (types, notification_types, negated, due_dates + today)
      - path: packages/core/inbox/filters.ts
        why: InboxFilters / filterInboxItems, the semantics inbox_filter.go ports; a change there must update the parity fixture
      - path: packages/core/inbox/group.ts
        why: groupInboxRows / sortInboxNewestFirst, the one-row-per-issue rule
      - path: packages/core/inbox/snooze.ts
        why: isInboxItemSnoozed / inboxRowTime, snooze hiding and return-time order
      - path: packages/core/issues/stores/filter-tree.ts
