      - vitest: apps/desktop/src/main/updater-preferences.test.ts
        name: defaults automatic updates to disabled when the file is missing or invalid
    scenarios:
      - name: fork app installed on the Mac mini stays on the fork
        setup: calabii-macmini, app installed with scripts/hoon/desktop-app.sh install <X.Y.Z-hoon.N>
        steps:
          - Run scripts/hoon/desktop-app.sh verify <X.Y.Z-hoon.N>.
