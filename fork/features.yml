  - id: inbox-list-filters
    summary: "`multica inbox list` takes the web Inbox's filters as flags and lists the same rows: one per issue, newest first; --ungrouped for every notification. Sits on upstream's list (inbox-cli-manage)."
    status: active
    kind: cli
    cards: [CALA-138, CALA-248, CALA-273]
    origin:
      type: ours
      commits: ["5724f3b9d", "267194a85"]
    files:
      - server/cmd/multica/cmd_inbox.go
      - server/cmd/multica/cmd_inbox_test.go
      - server/cmd/multica/inbox_filter.go
      - server/cmd/multica/inbox_filter_test.go
