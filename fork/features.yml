# Fork feature registry: the one machine-readable list of what this fork
# changes on top of upstream Multica. Upstream-triage, fork-verify and the
# absorb gate all read this file; FORK.md points here instead of keeping its
# own table. Schema and rules: FORK.md "Fork feature registry".
# Checked by scripts/hoon/features-check.sh (run locally; see FORK.md "Verification").
# Quote commit ids: YAML reads an unquoted id such as 1234e56 as a number.
version: 1

# Fork upkeep, not features. Every file that differs from the upstream base tag
# must be claimed by a feature's `files` or matched here.
infrastructure:
  - path: NOTICE
    why: modified-fork line (Apache 2.0 §4(d))
  - path: FORK.md
  - path: AGENTS.md
    why: fork rules section appended for coding agents (local verification, no GitHub Actions)
  - path: fork/**
  - path: scripts/hoon/**
  - path: .github/workflows/fork-license.yml

features:
  - id: resident-hermes-gateway
    summary: One long-lived Hermes owner serves every task through per-task ACP viewers; tools find their task from a context file in the workdir.
    status: active
    kind: daemon
    cards: [CALA-197, CALA-245]
    origin:
      type: upstream-cherry-pick
      upstream_pr: 10119
      commits: ["2707ff0c3", "dcd2e0ccd"]
    files:
      - server/cmd/multica/cmd_agent.go
      - server/cmd/multica/resident_task.go
      - server/cmd/multica/resident_task_test.go
      - server/internal/daemon/daemon.go
      - server/internal/daemon/execenv/hermes_gateway.go
      - server/internal/daemon/execenv/hermes_home.go
      - server/internal/daemon/execenv/hermes_resident_gateway_test.go
      - server/internal/daemon/resident_task_context.go
      - server/internal/daemon/resident_task_context_test.go
      - apps/docs/content/docs/daemon-runtimes.mdx
      - apps/docs/content/docs/daemon-runtimes.zh.mdx
    watch:
      - path: server/internal/daemon/execenv/hermes_sessions.go
        why: HermesSessionStorePath; daemon.go skips the per-task session store when resident
      - path: server/internal/daemon/execenv/hermes_memory.go
        why: per-task Hermes home layout that resident mode bypasses
      - path: server/internal/daemon/types.go
        why: Task fields copied into .multica_resident_task.json
      - path: server/internal/cli/client.go
        why: APIClient AgentID/TaskID/WorkspaceID set from the resident credential
      - path: server/pkg/agent/hermes.go
        why: ACP client the per-task viewer runs
      - path: server/cmd/multica/cmd_auth.go
        why: task-context detection (inDaemonManagedExecutionContext) the resident credential must keep passing
    upstream_equivalent:
      prs: [10119]
      symbols: [ResidentHermesGatewayEnabled, MULTICA_HERMES_RESIDENT_GATEWAY, MULTICA_RESIDENT_OWNER, .multica_resident_task.json, residentTaskCredentialFromCwd]
      keywords: [resident gateway, resident hermes]
    tests:
      - go: server/cmd/multica
        name: TestResidentNewAPIClient
      - go: server/internal/daemon/execenv
        name: TestResidentGatewayKeepsGatewayStateMirrored
      - go: server/internal/daemon
        name: TestResidentSessionHomeReachable
      - go: server/internal/daemon
        name: TestResidentTaskContext
    scenarios:
      - name: resident task runs with its own identity
        setup: daemon started with MULTICA_HERMES_RESIDENT_GATEWAY=1 and a resident Hermes agent
        steps:
          - Assign a test issue to the resident Hermes agent.
          - From the task's tool shell run `multica issue get <issue-id> --output json`.
          - From the same shell run `multica issue comment add <issue-id> --content-file ./reply.md`.
          - After the run ends, list the task root (`ls -a ..` from the workdir).
        expect:
          - issue get returns the issue (no "not authenticated" / workspace error).
          - The comment is authored by the agent, not the resident owner's member account.
          - .multica_resident_task.json exists during the run and is gone after it.
    drop_when: "upstream PR #10119 (or an equivalent resident gateway mode) ships in an upstream release tag we merge; drop ours in that merge and re-base the resident follow-ups below on upstream's version."

  - id: resident-quick-create-context
    summary: Quick Create runs on the resident gateway get the MULTICA_QUICK_CREATE_* context, so issue create stamps origin and --assignee-picker works.
    status: active
    kind: daemon
    cards: []
    origin:
      type: ours
      commits: ["1d5640104"]
      release: 0.9.0-resident.2
    files:
      - server/cmd/multica/cmd_agent.go
      - server/cmd/multica/resident_task.go
      - server/cmd/multica/resident_task_test.go
      - server/internal/daemon/resident_task_context.go
      - server/internal/daemon/resident_task_context_test.go
    watch:
      - path: server/cmd/multica/cmd_issue.go
        why: reads MULTICA_QUICK_CREATE_* and resolves --assignee-picker
      - path: server/internal/daemon/daemon.go
        why: sets QuickCreate env for non-resident runs (QuickCreatePrompt branch)
      - path: server/internal/daemon/types.go
        why: Task.QuickCreatePrompt / QuickCreateAttachmentIDs
      - path: server/internal/service/task.go
        why: origin_type=quick_create provenance on agent-created issues
    upstream_equivalent:
      symbols: [quick_create_task_id, applyQuickCreateEnv]
      keywords: [quick create resident, resident quick create]
    tests:
      - go: server/cmd/multica
        name: TestResidentQuickCreateAssigneePicker
      - go: server/internal/daemon
        name: TestResidentTaskContextQuickCreate
    scenarios:
      - name: quick create through the resident agent
        setup: resident daemon as in resident-hermes-gateway
        steps:
          - Start a Quick Create with the resident Hermes agent and a one-line prompt.
          - Wait for the task to finish.
          - Run `multica issue get <created-issue> --output json`.
        expect:
          - The created issue has origin_type "quick_create" and origin_id = the quick-create task id.
          - Its assignee is the default picked for the run (the agent, or the squad for a squad run).
    drop_when: "upstream's resident mode passes quick-create context to resident tool shells itself (check together with #10119)."

  - id: resident-no-hermes-home-overlay
    summary: In resident mode the daemon skips the per-task hermes-home overlay; the viewer runs on the owner's real Hermes home.
    status: active
    kind: daemon
    cards: []
    origin:
      type: ours
      commits: ["7637018c6"]
      release: 0.9.0-resident.3
    files:
      - server/internal/daemon/execenv/execenv.go
    watch:
      - path: server/internal/daemon/execenv/hermes_home.go
        why: prepareHermesHomeTracked, the overlay this skips
      - path: server/internal/daemon/execenv/hermes_sessions.go
        why: session store mount tied to the overlay
    upstream_equivalent:
      keywords: [hermes home overlay, resident hermes home]
    tests: []
    tests_gap: no Go test pins the skipped overlay; the scenario below is the only check (fork-verify covers it).
    scenarios:
      - name: resident task has no hermes-home overlay
        setup: resident daemon as in resident-hermes-gateway, agent with at least one skill
        steps:
          - Run any task on the resident Hermes agent.
          - From its workdir run `ls -a ..`.
        expect:
          - The task root has no hermes-home directory.
    drop_when: upstream drops or conditions the per-task overlay for resident mode.

  - id: hermes-steer-supplement
    summary: Comments posted while a Hermes task runs reach it through Hermes' /steer (task supplements), as other providers already do.
    status: active
    kind: server
    cards: []
    origin:
      type: ours
      commits: ["9204e1d53"]
      release: 0.9.0-resident.4
    files:
      - server/pkg/agent/hermes.go
      - server/pkg/agent/hermes_supplement.go
      - server/pkg/agent/hermes_supplement_integration_test.go
      - server/pkg/agent/hermes_supplement_test.go
      - server/pkg/agent/version.go
      - server/pkg/agent/version_test.go
      - server/pkg/db/queries/supplement.sql
      - server/pkg/db/generated/supplement.sql.go
    watch:
      - path: server/pkg/agent/agent.go
        why: Session.Supplement / SupplementReady contract
      - path: server/pkg/agent/*_supplement.go
        why: other providers' supplement pattern; upstream changes there usually change the contract
      - path: server/internal/daemon/task_supplement.go
        why: daemon side that calls Session.Supplement
      - path: server/internal/handler/task_supplement.go
        why: server side that claims supplements
      - path: server/internal/service/chat_supplement.go
        why: chat steering path (v0.11 non-interrupting chat steering)
      - path: server/pkg/db/queries/chat_supplement.sql
        why: capability join used with the provider list we extended
    upstream_equivalent:
      symbols: [hermesSupplementSession, "'hermes')"]
      keywords: [hermes steer, hermes supplement, task supplement hermes]
    tests:
      - go: server/pkg/agent
        name: TestHermesSupplementSteersActivePrompt
      - go: server/pkg/agent
        name: TestHermesSupplementRequiresSteerAcknowledgement
      - go: server/pkg/agent
        name: TestHermesSupplementNotExposedWithoutNegotiationOrForCustomRuntime
      - go: server/pkg/agent
        name: TestTaskSupplementVersionGate
      - go: server/pkg/agent
        name: TestHermesRealACPSteerSmoke
        tags: agentintegration
        real_agent: true
    scenarios:
      - name: comment steers a running Hermes task
        setup: Hermes >= 0.22.3 runtime
        steps:
          - Start a Hermes task that takes over a minute (e.g. a long investigation issue).
          - While it runs, post a comment on the issue with a short extra instruction.
          - Read the run's messages (`multica issue run-messages <task-id> --output json`).
        expect:
          - No new run is queued for that comment.
          - The run's messages include "⏩ Steer queued" and the run's result reflects the extra instruction.
    drop_when: upstream adds hermes to the task-supplement providers (supplement.sql provider list and SupportsTaskSupplement).

  - id: resident-daemon-local-commands
    summary: repo checkout and environment commands work from a resident Hermes tool shell (daemon port and agent name come from the context file).
